<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak | Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b0f2b, #000);
      color: #fff;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .logo img {
      height: 38px;
    }

    .logo span {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 22px;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-size: 1.25rem;
      white-space: nowrap;
    }

    nav a:hover {
      color: #8ab4ff;
    }

    /* ===== MAIN ===== */
    main {
      max-width: 1100px;
      margin: auto;
      padding: 80px 20px;
    }

    main h1 {
      text-align: center;
      font-size: 2.8rem;
      margin-bottom: 50px;
    }

    /* ===== BLOG KARTLARI ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 26px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 24px;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 0.8s ease forwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.25s; }
    .card:nth-child(3) { animation-delay: 0.4s; }

    .card h3 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .card p {
      opacity: 0.8;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== FOOTER ===== */
    footer {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="KozmikOdak Logo">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<main>
  <h1>Blog</h1>

  <div class="cards">
    <div class="card">
      <h3>🌌 Evrenin Derinlikleri</h3>
      <p>Evrenin bilinmeyen yönlerini birlikte keşfediyoruz.</p>
    </div>

    <div class="card">
      <h3>🪐 Astronomi Notları</h3>
      <p>Gezegenler, yıldızlar ve galaksiler hakkında yazılar.</p>
    </div>

    <div class="card">
      <h3>🚀 Bilim & Teknoloji</h3>
      <p>Uzay teknolojileri ve bilimsel gelişmeler.</p>
    </div>
  </div>
</main>

<footer>
  © @İsmail Eren KENANOĞLU
</footer>

</body>
</html>
