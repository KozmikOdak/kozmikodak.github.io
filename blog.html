<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak | Blog</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0b0f1a;
  color:#fff;
}

/* HEADER (AYNI) */
header{
  background:rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  padding:28px 20px 22px;
  text-align:center;
}

.header-top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.header-top img{
  width:50px;
  height:50px;
}

.header-top span{
  font-size:2.3rem;
  font-weight:bold;
}

nav{
  display:flex;
  justify-content:center;
  gap:52px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:1.55rem;
}

nav a:hover{
  color:#4da3ff;
}

/* BLOG */
.blog{
  padding:60px 10%;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
  gap:30px;
}

.post{
  background:#11182c;
  padding:25px;
  border-radius:12px;
  transition:transform .4s, box-shadow .4s;
}

.post:hover{
  transform:translateY(-12px) scale(1.02);
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <img src="logo.png">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<div class="blog">
  <div class="post">🛰️ James Webb Güncellemeleri</div>
  <div class="post">🌌 Kara Delikler</div>
  <div class="post">🚀 Mars Görevleri</div>
</div>

</body>
</html>
