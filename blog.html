<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak | Blog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b0f2b, #000);
      color: #fff;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 16px 24px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img { height: 40px; }

    .logo span {
      font-size: 1.6rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-size: 1.3rem;
    }

    nav a:hover { color: #8ab4ff; }

    /* ===== BLOG ===== */
    main {
      padding: 80px 20px 120px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
    }

    .post {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 28px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
    }

    .post:nth-child(1) { animation-delay: 0.2s; }
    .post:nth-child(2) { animation-delay: 0.4s; }
    .post:nth-child(3) { animation-delay: 0.6s; }

    .post:hover {
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 20px rgba(138,180,255,0.25);
    }

    footer {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      opacity: 0.6;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<main>
  <h1>Blog</h1>

  <div class="post">
    <h3>🚀 Yakında</h3>
    <p>KozmikOdak blog içerikleri çok yakında yayında olacak.</p>
  </div>

  <div class="post">
    <h3>🌌 Evren Neden Karanlık?</h3>
    <p>Basit görünen ama derin bir soru…</p>
  </div>

  <div class="post">
    <h3>🔭 Astronomi Neden Önemli?</h3>
    <p>Gökyüzüne bakmak kendimizi anlamaktır.</p>
  </div>
</main>

<footer>
  © @İsmail Eren KENANOĞLU
</footer>

</body>
</html>
