<!DOCTYPE html>
<html lang="tr">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b0f2b, #000);
      color: #fff;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
      display: flex;

      gap: 10px;

    .logo img { height: 38px; }

    .logo span {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-size: 1.25rem;
      white-space: nowrap;
    }

    nav a:hover { color: #8ab4ff; }

    /* ===== MAIN ===== */
    main {
      max-width: 800px;
      margin: auto;
      padding: 90px 20px;
      text-align: center;
    }

    .box {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 40px;
    }

    footer {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>

<header>

    <h1>Hakkında</h1>
    <p>
      KozmikOdak; astronomi, bilim ve teknolojiye meraklı insanlar için
      kurulmuş bir içerik platformudur.
    </p>
    <p>
      Bu proje <strong>İsmail Eren KENANOĞLU</strong> tarafından
