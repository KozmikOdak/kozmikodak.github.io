<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* ===== ARKA PLAN ===== */
body {
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
    url("https://images-assets.nasa.gov/image/PIA12235/PIA12235~orig.jpg");
  background-size: cover;
  background-position: center;
}

/* ===== YILDIZ CANVAS ===== */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ===== NAVBAR ===== */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 70px;
  padding: 0 25px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  z-index: 5;
}

.logo {
  font-weight: bold;
  font-size: 1.3em;
}

/* ===== DESKTOP MENU (BÜYÜTÜLDÜ) ===== */
.menu-desktop {
  display: flex;
  gap: 40px;
}

.menu-desktop a {
  color: white;
  text-decoration: none;
  font-size: 1.3em;
  padding: 10px 5px;
  opacity: 0.9;
}

/* ===== HAMBURGER ===== */
.hamburger {
  display: none;
  font-size: 2.8em;
  cursor: pointer;
  user-select: none;
}

/* ===== MOBİL YAN MENÜ (BÜYÜTÜLDÜ) ===== */
.mobile-menu {
  position: fixed;
  top: 0;
  right: -300px;
  width: 300px;
  height: 100%;
  background: rgba(0,0,0,0.96);
  backdrop-filter: blur(12px);
  padding: 90px 25px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 35px;
  transition: right 0.3s ease;
  z-index: 6;
}

.mobile-menu a {
  color: white;
  text-decoration: none;
  font-size: 1.8em;
}

.mobile-menu.active {
  right: 0;
}

/* ===== MOBİL ===== */
@media (max-width: 768px) {
  .menu-desktop {
    display: none;
  }

  .hamburger {
    display: block;
  }
}

/* ===== İÇERİK ===== */
.content {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-top: 70px;
}

h1 {
  font-size: 3.2em;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(255,255,255,0.35);
}

.subtitle {
  font-size: 1.2em;
  opacity: 0.8;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.tagline {
  font-size: 1.05em;
  opacity: 0.9;
}

/* ===== SAĞ ALT İMZA ===== */
.signature {
  position: fixed;
  right: 12px;
  bottom: 10px;
  font-size: 0.75em;
  opacity: 0.5;
  z-index: 4;
  pointer-events: none;
}
</style>
</head>

<body>

<nav>
  <div class="logo">🌌 KozmikOdak</div>

  <div class="menu-desktop">
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>
</nav>

<!-- MOBİL MENÜ -->
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Ana Sayfa</a>
  <a href="blog.html">Blog</a>
  <a href="hakkinda.html">Hakkında</a>
</div>

<!-- YILDIZLAR -->
<canvas id="stars"></canvas>

<div class="content">
  <h1>🌌 KozmikOdak</h1>
  <div class="subtitle">yakında sizlerleyiz…</div>
  <div class="tagline">Durmak yok, araştırmaya devam.</div>
</div>

<!-- İMZA -->
<div class="signature">@İsmail Eren KENANOĞLU</div>

<script>
function toggleMenu() {
  document.getElementById("mobileMenu").classList.toggle("active");
}

/* YILDIZ ANİMASYONU */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const stars = [];
const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);

for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    s: Math.random() * 0.3 + 0.05
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  for (const star of stars) {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();

    star.y += star.s;
    if (star.y > canvas.height) {
      star.y = 0;
      star.x = Math.random() * canvas.width;
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
