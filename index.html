<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b0f2b, #000);
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img { height: 40px; }

    .logo span {
      font-size: 1.6rem;
      font-weight: bold;
    }

    nav {
      display: flex;
      align-items: center;
    }

    nav a {
      margin-left: 28px;
      text-decoration: none;
      color: #fff;
      font-size: 1.3rem;
    }

    nav a:hover { color: #8ab4ff; }

    .insta-btn {
      padding: 10px 20px;
      border-radius: 30px;
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
      color: #fff !important;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .insta-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(221,42,123,0.6);
    }

    main {
      text-align: center;
      padding: 90px 20px;
    }

    main h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    main p {
      font-size: 1.3rem;
      opacity: 0.85;
      margin-bottom: 70px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 32px;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 20px rgba(138,180,255,0.25);
    }

    footer {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      nav a {
        margin-left: 16px;
        font-size: 1.15rem;
      }

      main h1 { font-size: 2.4rem; }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="KozmikOdak Logo">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>

    <a
      href="https://www.instagram.com/kozmikodak?igsh=MW1ka3pnc252am1oNg%3D%3D&utm_source=qr"
      target="_blank"
      class="insta-btn"
    >
      📷 Instagram
    </a>
  </nav>
</header>

<main>
  <h1>KozmikOdak</h1>
  <p>Yakında sizlerleyiz…</p>

  <section class="cards">
    <div class="card">
      <h3>🌌 Astronomi</h3>
      <p>Evren, yıldızlar ve bilinmeyenler üzerine içerikler.</p>
    </div>

    <div class="card">
      <h3>🔬 Bilim</h3>
      <p>Merak edenler için sade ve anlaşılır anlatımlar.</p>
    </div>

    <div class="card">
      <h3>💻 Teknoloji</h3>
      <p>Geleceği şekillendiren fikirler ve projeler.</p>
    </div>
  </section>
</main>

<footer>
  © @İsmail Eren KENANOĞLU
</footer>

</body>
</html>
