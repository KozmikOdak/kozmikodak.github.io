<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KozmikOdak</title>

<style>
/* ===== GENEL ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:radial-gradient(circle at top, #0b0f2b, #000);
  color:#fff;
  min-height:100vh;
}

/* ===== ÜST MENÜ ===== */
header{
  width:100%;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

nav{
  display:flex;
  gap:40px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:1.4rem;
  position:relative;
}

nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0;
  height:2px;
  background:#8ab4ff;
  transition:.3s;
}

nav a:hover::after{
  width:100%;
}

/* ===== ANA ORTA ALAN ===== */
.hero{
  text-align:center;
  margin-top:80px;
}

.hero img{
  width:120px;
  margin-bottom:15px;
}

.hero h1{
  font-size:3.2rem;
  letter-spacing:2px;
}

.hero p{
  margin-top:10px;
  opacity:.8;
  font-size:1.2rem;
}

/* ===== KARTLAR ===== */
.cards{
  max-width:1100px;
  margin:80px auto;
  padding:0 40px;

  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
  gap:30px;
}

.card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:8px;
  aspect-ratio:1/1;

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

  font-size:1.3rem;
  letter-spacing:.5px;

  opacity:0;
  transform:translateY(30px);
  animation:fadeUp .8s ease forwards;
}

.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.2s}

.card:hover{
  background:rgba(138,180,255,0.08);
  border-color:#8ab4ff;
  transform:translateY(-4px);
  transition:.25s ease;
}

/* ===== INSTAGRAM BUTONU ===== */
.social{
  display:flex;
  justify-content:center;
  margin-bottom:80px;
}

.instagram{
  padding:14px 32px;
  border-radius:30px;
  background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
  color:white;
  text-decoration:none;
  font-size:1.2rem;
}

/* ===== FOOTER İMZA ===== */
.signature{
  position:fixed;
  bottom:8px;
  right:12px;
  font-size:.7rem;
  opacity:.5;
}

/* ===== ANİMASYON ===== */
@keyframes fadeUp{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ===== MOBİL ===== */
@media(max-width:700px){
  nav{
    gap:20px;
  }
  nav a{
    font-size:1.2rem;
  }
  .hero h1{
    font-size:2.4rem;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<section class="hero">
  <img src="logo.png" alt="KozmikOdak Logo">
  <h1>KozmikOdak</h1>
  <p>Yakında sizlerleyiz…</p>
</section>

<section class="cards">
  <div class="card">🌌 Astronomi</div>
  <div class="card">🛰️ Uzay Teknolojisi</div>
  <div class="card">🔭 Gözlem</div>
</section>

<div class="social">
  <a class="instagram"
     href="https://www.instagram.com/kozmikodak?igsh=MW1ka3pnc252am1oNg%3D%3D&utm_source=qr"
     target="_blank">
     Instagram
  </a>
</div>

<div class="signature">
  © @İsmail Eren KENANOĞLU
</div>

</body>
</html>
