<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top, #0b0f2b, #000 70%);
  min-height:100vh;
}

/* ===== HEADER ===== */
header{
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  padding:28px 20px 22px;
  text-align:center;
}

.header-top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.header-top img{
  width:50px;
  height:50px;
}

.header-top span{
  font-size:2.3rem;
  font-weight:bold;
  letter-spacing:1px;
}

nav{
  display:flex;
  justify-content:center;
  gap:52px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:1.55rem;
  opacity:0.9;
}

nav a:hover{
  color:#8ab4ff;
}

/* ===== HERO ===== */
.hero{
  text-align:center;
  padding:90px 20px 70px;
}

.hero h1{
  font-size:3.2rem;
  margin-bottom:12px;
}

.hero p{
  font-size:1.3rem;
  opacity:0.8;
}

/* ===== KARTLAR ===== */
.cards{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
}

.card{
  background: rgba(255,255,255,0.06);
  border-radius:16px;
  padding:28px;
  transition: transform .4s ease, box-shadow .4s ease;
}

.card:hover{
  transform: translateY(-10px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.6);
}

/* ===== FOOTER ===== */
footer{
  position:fixed;
  right:10px;
  bottom:10px;
  font-size:0.75rem;
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <img src="logo.png" alt="KozmikOdak Logo">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<section class="hero">
  <h1>KozmikOdak</h1>
  <p>Durmak yok, araştırmaya devam.</p>
</section>

<section class="cards">
  <div class="card">🌌 Evren & Galaksiler</div>
  <div class="card">🪐 Astronomi Notları</div>
  <div class="card">🚀 Bilim & Teknoloji</div>
</section>

<footer>
  © @İsmail Eren KENANOĞLU
</footer>

</body>
</html>
