<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* ===== ARKA PLAN ===== */
body {
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
    url("https://images-assets.nasa.gov/image/PIA12235/PIA12235~orig.jpg");
  background-size: cover;
  background-position: center;
}

/* ===== CANVAS (ARKADA KALSIN) ===== */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none; /* 🔥 MENÜYÜ TIKLANIR YAPAN ŞEY */
}

/* ===== NAVBAR ===== */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  padding: 0 20px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(8px);
  z-index: 5;
}

.logo {
  font-weight: bold;
  font-size: 1.1em;
}

/* Desktop menu */
.menu-desktop {
  display: flex;
  gap: 25px;
}

.menu-desktop a {
  color: white;
  text-decoration: none;
  opacity: 0.85;
}

/* ===== HAMBURGER ===== */
.hamburger {
  display: none;
  font-size: 2.2em;
  cursor: pointer;
  user-select: none;
}

/* ===== MOBİL YAN MENÜ ===== */
.mobile-menu {
  position: fixed;
  top: 0;
  right: -260px;
  width: 260px;
  height: 100%;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(10px);
  padding: 80px 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 25px;
  transition: right 0.3s ease;
  z-index: 6;
}

.mobile-menu a {
  color: white;
  text-decoration: none;
  font-size: 1.4em;
}

.mobile-menu.active {
  right: 0;
}

/* ===== MOBİL AYAR ===== */
@media (max-width: 768px) {
  .menu-desktop {
    display: none;
  }

  .hamburger {
    display: block;
  }
}

/* ===== İÇERİK ===== */
.content {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-top: 60px;
}

h1 {
  font-size: 3em;
  margin-bottom: 10px;
  text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

p {
  opacity: 0.9;
}
</style>
</head>

<body>

<nav>
  <div class="logo">🌌 KozmikOdak</div>

  <div class="menu-desktop">
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>
</nav>

<!-- MOBİL YAN MENÜ -->
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Ana Sayfa</a>
  <a href="blog.html">Blog</a>
  <a href="hakkinda.html">Hakkında</a>
</div>

<!-- YILDIZLAR -->
<canvas id="stars"></canvas>

<div class="content">
  <h1>KozmikOdak</h1>
  <p>Durmak yok, araştırmaya devam.</p>
</div>

<script>
function toggleMenu() {
  document.getElementById("mobileMenu").classList.toggle("active");
}

/* YILDIZ ANİMASYONU */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const stars = [];
const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);

for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    s: Math.random() * 0.3 + 0.05
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  for (const star of stars) {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();

    star.y += star.s;
    if (star.y > canvas.height) {
      star.y = 0;
      star.x = Math.random() * canvas.width;
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
