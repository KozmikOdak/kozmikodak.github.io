<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* ARKA PLAN */
body {
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.85)),
    url("https://images-assets.nasa.gov/image/PIA12235/PIA12235~orig.jpg");
  background-size: cover;
  background-position: center;
}

/* YILDIZLAR */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  padding: 0 30px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  z-index: 5;
}

/* LOGO ALANI */
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.5em;
  font-weight: bold;
}

.logo img {
  width: 42px;
  height: 42px;
}

/* DESKTOP MENÜ */
.menu-desktop {
  display: flex;
  gap: 50px;
}

.menu-desktop a {
  color: white;
  text-decoration: none;
  font-size: 1.6em;
  padding: 12px 10px;
}

/* HAMBURGER */
.hamburger {
  display: none;
  font-size: 3.2em;
  cursor: pointer;
}

/* MOBİL MENÜ */
.mobile-menu {
  position: fixed;
  top: 0;
  right: -320px;
  width: 320px;
  height: 100%;
  background: rgba(0,0,0,0.97);
  padding: 100px 30px;
  display: flex;
  flex-direction: column;
  gap: 40px;
  transition: right 0.3s ease;
  z-index: 6;
}

.mobile-menu a {
  color: white;
  text-decoration: none;
  font-size: 2.2em;
}

.mobile-menu.active {
  right: 0;
}

@media (max-width: 768px) {
  .menu-desktop { display: none; }
  .hamburger { display: block; }
}

/* ANA İÇERİK */
.content {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-top: 110px;
  text-align: center;
}

h1 {
  font-size: 3.4em;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 1.3em;
  opacity: 0.8;
}

.tagline {
  font-size: 1.1em;
  margin-bottom: 60px;
}

/* KARTLAR */
.cards {
  display: flex;
  gap: 30px;
  justify-content: center;
  flex-wrap: wrap;
  padding: 0 20px 100px;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border-radius: 15px;
  width: 280px;
  padding: 30px 20px;
}

.card h3 {
  font-size: 1.4em;
}

/* İMZA */
.signature {
  position: fixed;
  right: 12px;
  bottom: 10px;
  font-size: 0.75em;
  opacity: 0.5;
  pointer-events: none;
  z-index: 4;
}
</style>
</head>

<body>

<nav>
  <div class="logo">
    <img src="logo.png" alt="KozmikOdak Logo">
    KozmikOdak
  </div>

  <div class="menu-desktop">
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </div>

  <div class="hamburger" onclick="toggleMenu()">☰</div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Ana Sayfa</a>
  <a href="blog.html">Blog</a>
  <a href="hakkinda.html">Hakkında</a>
</div>

<canvas id="stars"></canvas>

<div class="content">
  <h1>KozmikOdak</h1>
  <div class="subtitle">yakında sizlerleyiz…</div>
  <div class="tagline">Durmak yok, araştırmaya devam.</div>
</div>

<div class="signature">@İsmail Eren KENANOĞLU</div>

<script>
function toggleMenu() {
  document.getElementById("mobileMenu").classList.toggle("active");
}

/* YILDIZ ANİMASYONU */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const stars = [];
for (let i = 0; i < 180; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.3,
    s: Math.random() * 0.3 + 0.05
  });
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "white";
  for (const s of stars) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    s.y += s.s;
    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
