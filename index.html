<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;

      /* YILDIZLI UZAY ARKA PLAN */
      background-image:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)),
        url("https://images-assets.nasa.gov/image/PIA12235/PIA12235~orig.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    h1 {
      font-size: 3.4em;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .tag {
      margin-top: 20px;
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 20px;
      font-size: 0.9em;
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body>
  <h1>🌌 KozmikOdak</h1>
  <p>Durmak yok, araştırmaya devam.</p>
  <div class="tag">Astronomi • Uzay • Bilim</div>
</body>
</html>
