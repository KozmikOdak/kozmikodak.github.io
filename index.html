<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #fff;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)),
        url("https://images-assets.nasa.gov/image/PIA12235/PIA12235~orig.jpg");
      background-size: cover;
      background-position: center;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      z-index: 2;
    }

    .logo {
      font-weight: bold;
      letter-spacing: 1px;
    }

    .menu {
      display: flex;
      gap: 25px;
    }

    .menu a {
      color: #fff;
      text-decoration: none;
      opacity: 0.85;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      font-size: 1.8em;
      cursor: pointer;
    }

    /* ===== MOBİL ===== */
    @media (max-width: 768px) {
      .menu {
        position: absolute;
        top: 60px;
        right: 20px;
        background: rgba(0,0,0,0.85);
        backdrop-filter: blur(6px);
        flex-direction: column;
        gap: 15px;
        padding: 15px 20px;
        border-radius: 10px;
        display: none;
      }

      .menu.active {
        display: flex;
      }

      .hamburger {
        display: block;
      }
    }

    /* ===== YILDIZLAR ===== */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===== İÇERİK ===== */
    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 60px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255,255,255,0.35);
    }

    p {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">🌌 KozmikOdak</div>
    <div class="menu" id="menu">
      <a href="#">Ana Sayfa</a>
      <a href="#">Blog</a>
      <a href="#">Hakkında</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
  </nav>

  <!-- YILDIZLAR -->
  <canvas id="stars"></canvas>

  <!-- İÇERİK -->
  <div class="content">
    <h1>KozmikOdak</h1>
    <p>Durmak yok, araştırmaya devam.</p>
  </div>

  <!-- YILDIZ SCRIPT -->
  <script>
    function toggleMenu() {
      document.getElementById("menu").classList.toggle("active");
    }

    const canvas = document.getElementById("stars");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    const STAR_COUNT = Math.floor((window.innerWidth * window.innerHeight) / 9000);
    const stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.3,
        s: Math.random() * 0.25 + 0.05
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";

      for (const star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();

        star.y += star.s;
        if (star.y > canvas.height) {
          star.y = 0;
          star.x = Math.random() * canvas.width;
        }
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>

</body>
</html>
