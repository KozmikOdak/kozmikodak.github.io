<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>KozmikOdak</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#0b0f1a;
  color:#fff;
}

/* HEADER */
header{
  background:rgba(0,0,0,0.65);
  backdrop-filter: blur(6px);
  padding:28px 20px 22px;
  text-align:center;
}

.header-top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  margin-bottom:16px;
}

.header-top img{
  width:50px;
  height:50px;
}

.header-top span{
  font-size:2.3rem;
  font-weight:bold;
}

nav{
  display:flex;
  justify-content:center;
  gap:52px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-size:1.55rem;
  opacity:0.9;
}

nav a:hover{
  color:#4da3ff;
}

/* KARTLAR */
.main{
  padding:60px 10%;
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:30px;
}

.card{
  background:#11182c;
  padding:25px;
  border-radius:12px;
  transition:transform .4s, box-shadow .4s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 15px 30px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <img src="logo.png" alt="KozmikOdak Logo">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="hakkinda.html">Hakkında</a>
  </nav>
</header>

<div class="main">
  <div class="card">Uzay ve Astronomi</div>
  <div class="card">Bilimsel Keşifler</div>
  <div class="card">Kozmik Haberler</div>
</div>

</body>
</html>
