<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>KozmikOdak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b0f2b, #000);
      color: #fff;
      min-height: 100vh;
    }

    /* ===== ÜST MENÜ ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .logo span {
      font-size: 1.6rem;
      font-weight: bold;
    }

    nav a {
      margin-left: 28px;
      text-decoration: none;
      color: #fff;
      font-size: 1.25rem; /* menü büyüklüğü */
      transition: color 0.2s;
    }

    nav a:hover {
      color: #8ab4ff;
    }

    /* ===== ANA ALAN ===== */
    main {
      text-align: center;
      padding: 80px 20px;
    }

    main h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    main p {
      font-size: 1.3rem;
      opacity: 0.85;
      margin-bottom: 60px;
    }

    /* ===== KARTLAR ===== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 30px;
      transition: transform 0.2s, background 0.2s;
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.08);
    }

    .card h3 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .card p {
      font-size: 1.05rem;
      opacity: 0.8;
    }

    /* ===== SOSYAL MEDYA ===== */
    .social {
      margin-top: 80px;
    }

    .social a {
      display: inline-block;
      margin: 0 12px;
      font-size: 1.2rem;
      color: #8ab4ff;
      text-decoration: none;
    }

    .social a:hover {
      text-decoration: underline;
    }

    /* ===== SAĞ ALT İMZA ===== */
    footer {
      position: fixed;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      opacity: 0.6;
    }

    /* ===== MOBİL ===== */
    @media (max-width: 600px) {
      nav a {
        margin-left: 16px;
        font-size: 1.15rem;
      }

      main h1 {
        font-size: 2.4rem;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <!-- LOGO DOSYA ADI: logo.png -->
    <img src="logo.png" alt="KozmikOdak Logo">
    <span>KozmikOdak</span>
  </div>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="blog.html">Blog</a>
    <a href="about.html">Hakkında</a>
  </nav>
</header>

<main>
  <h1>KozmikOdak</h1>
  <p>Yakında sizlerleyiz…</p>

  <section class="cards">
    <div class="card">
      <h3>Astronomi</h3>
      <p>Evren, yıldızlar ve bilinmeyenler üzerine içerikler.</p>
    </div>

    <div class="card">
      <h3>Bilim</h3>
      <p>Merak edenler için sade ve net anlatımlar.</p>
    </div>

    <div class="card">
      <h3>Teknoloji</h3>
      <p>Geleceği şekillendiren fikirler ve projeler.</p>
    </div>
  </section>

  <div class="social">
    <a href="https://www.instagram.com/kozmikodak?igsh=MW1ka3pnc252am1oNg%3D%3D&utm_source=qr" target="_blank">
      Instagram
    </a>
  </div>
</main>

<footer>
  © @İsmail Eren KENANOĞLU
</footer>

</body>
</html>
